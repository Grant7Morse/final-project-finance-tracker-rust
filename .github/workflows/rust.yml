name: Rust CI

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build project
        run: cargo build

      - name: Run tests
        run: cargo test

      - name: Run formatter check
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy -- -D warnings